[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agentic-rag-research-assistant"
version = "0.1.0"
description = "Autonomous multi-tool RAG research assistant powered by LangGraph and Reflexion."
authors = [{ name = "Rohi Bindal", email = "rohibindal01@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
